services:
  - type: web
    name: resolveai
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEFAULT_CURRENCY
        value: USD
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:///./resolveai.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_LAB
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
